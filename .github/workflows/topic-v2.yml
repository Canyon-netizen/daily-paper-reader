name: topic-v2

# PR-6 v2: Topic v2 离线批处理 cron — 跑 4 信号 + Elo 辩论 + 落盘 archive。
#
# 设计: 单独的工作流,默认每周一次(辩论成本高),可手动触发。
# 与 daily-paper-reader.yml(每日)解耦,允许独立失败/独立回滚。

on:
  schedule:
    - cron: "0 4 * * 0"  # 每周日 04:00 UTC(北京时间 12:00)跑一次
  workflow_dispatch:
    inputs:
      session_id:
        description: "可选: 指定 session id;留空则处理所有 sessions"
        required: false
        default: ""
      judge_mode:
        description: "judge 模式: stub / llm (stub = dry-run,无 LLM call)"
        required: false
        default: "stub"

permissions:
  contents: write

concurrency:
  group: topic-v2
  cancel-in-progress: false

jobs:
  run-debate:
    if: github.repository == 'Canyon-netizen/daily-paper-reader' || github.repository == 'ziwenhahaha/daily-paper-reader' || github.repository == '5-xj/daily-paper-reader'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JUDGE_MODE: ${{ github.event.inputs.judge_mode || 'stub' }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No install step needed: topic-v2-run.mjs is pure ESM with zero dependencies.
      # Runs directly via `node` — no bun, no pip, no requirements.txt.

      - name: Run Topic v2 orchestrator (default cron / no inputs)
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.session_id == '' && github.event.inputs.judge_mode == '')
        run: node astro-src/scripts/topic-v2-run.mjs --all --dry-run --max-sessions 5

      - name: Run Topic v2 orchestrator (with session_id, dry-run)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.session_id != '' && (github.event.inputs.judge_mode == '' || github.event.inputs.judge_mode == 'stub')
        run: node astro-src/scripts/topic-v2-run.mjs --session ${{ github.event.inputs.session_id }} --dry-run

      - name: Run Topic v2 orchestrator (with session_id + llm judge)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.judge_mode == 'llm'
        run: node astro-src/scripts/topic-v2-run.mjs --session ${{ github.event.inputs.session_id }}

      - name: Commit archive/<session_id>/debate/ if changed
        run: |
          if [ -d archive ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add archive/
            if git diff --staged --quiet; then
              echo "No archive changes to commit"
            else
              # Extract session_id from the run; default to 'all' if running --all
              SESSION_ID="${{ github.event.inputs.session_id }}"
              if [ -z "$SESSION_ID" ]; then
                SESSION_ID="all"
              fi
              git commit -m "topic-v2: update archive/${SESSION_ID}/debate/ [skip ci]"
              git push
            fi
          else
            echo "No archive/ directory created"
          fi
