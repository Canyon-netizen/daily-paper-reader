name: save-paper

# 由 web /paper-analyzer/ 页面 "📤 保存到 GitHub" 按钮触发。
# 接收 client_payload,把论文 Markdown 写到 docs/papers/<arxiv-id>-slug.md,
# 然后 commit & push,触发 Cloudflare Pages 自动 rebuild。
#
# 三种模式:
#   - glance: 写一份新的速读 .md(Web 端已拼好整篇)
#   - append-deepdive: 读现有 .md → 末尾追加"## 深度精读"章节 → 可选抽图 → 写回
#   - combined: 一次性写完整 .md(frontmatter + 速读四段 + Abstract + 精读全文),
#               不要求 .md 已存在,适合"我搜到就要精读"的 web analyzer 流程

on:
  workflow_dispatch:
    inputs:
      md_content:
        description: "完整 Markdown 内容(含 frontmatter + 速读 + 可选精读);glance 和 combined 模式用,combined 模式下必须包含精读全文"
        required: false
        type: string
        default: ""
      arxiv_id:
        description: "短 ID,如 2606.26474v1"
        required: true
        type: string
      slug:
        description: "URL slug,kebab-case ASCII"
        required: true
        type: string
      message:
        description: "commit message"
        required: false
        type: string
        default: "[chore] add paper from web analyzer"
      mode:
        description: "glance | append-deepdive | combined"
        required: false
        type: string
        default: "glance"
      deep_dive_md:
        description: "精读 markdown 全文(mode=append-deepdive 时必填)"
        required: false
        type: string
        default: ""
      used_model:
        description: "生成精读用的 model 名,写入深度精读元信息"
        required: false
        type: string
        default: ""
      truncated_pct:
        description: "若 PDF 被截断,写入精读元信息(0-100,100=全文)"
        required: false
        type: string
        default: "100"
      needs_figures:
        description: "true 时用 PyMuPDF 从 PDF 抽图到 docs/assets/figures/arxiv/<id>/"
        required: false
        type: string
        default: "false"
      figures_url:
        description: "PDF URL(needs_figures=true 时用),如 https://arxiv.org/pdf/2510.18483v1"
        required: false
        type: string
        default: ""
      date:
        description: "论文发表日 YYYY-MM-DD(权威日期源);bioRxiv 可省略(从文件名解析),arxiv 强烈建议传"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: save-paper
  cancel-in-progress: false

# PR-7: Citation Guard 开关（默认 disabled）。启用后 Deep Dive 写盘后跑引用核查。
# 在 workflow_dispatch 的 inputs 中可启用（默认 false）。vars.CITATION_GUARD_ENABLED 是
# 可选的额外通道（若 Repo 设了该 variable，会被 inputs.citation_guard 覆盖）。
env:
  CITATION_GUARD_ENABLED: 'false'

jobs:
  commit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validate inputs
        env:
          MD_CONTENT: ${{ inputs.md_content }}
          ARXIV_ID: ${{ inputs.arxiv_id }}
          SLUG: ${{ inputs.slug }}
          MODE: ${{ inputs.mode }}
          DEEP_MD: ${{ inputs.deep_dive_md }}
          NEEDS_FIGS: ${{ inputs.needs_figures }}
        run: |
          set -euo pipefail
          : "${ARXIV_ID:?arxiv_id is required}"
          : "${SLUG:?slug is required}"
          # slug 只允许 [a-z0-9-],长度 1-80,防路径注入
          if ! [[ "$SLUG" =~ ^[a-z0-9-]{1,80}$ ]]; then
            echo "::error::slug 必须是 kebab-case ASCII(只含 a-z, 0-9, -, 长度 1-80),实际收到: [$SLUG](len=${#SLUG})"
            exit 1
          fi
          if ! [[ "$ARXIV_ID" =~ ^[a-zA-Z0-9._/-]+$ ]]; then
            echo "::error::arxiv_id 包含非法字符"
            exit 1
          fi
          if [[ "$MODE" != "glance" && "$MODE" != "append-deepdive" && "$MODE" != "combined" ]]; then
            echo "::error::mode 必须是 glance / append-deepdive / combined 之一,收到: $MODE"
            exit 1
          fi
          if [[ "$MODE" == "append-deepdive" && -z "$DEEP_MD" ]]; then
            echo "::error::mode=append-deepdive 时 deep_dive_md 不能为空"
            exit 1
          fi
          if [[ "$MODE" == "glance" && -z "$MD_CONTENT" ]]; then
            echo "::error::mode=glance 时 md_content 不能为空"
            exit 1
          fi
          if [[ "$MODE" == "combined" && -z "$MD_CONTENT" ]]; then
            echo "::error::mode=combined 时 md_content 不能为空"
            exit 1
          fi
          if [[ "$NEEDS_FIGS" != "true" && "$NEEDS_FIGS" != "false" ]]; then
            echo "::error::needs_figures 必须是 true 或 false"
            exit 1
          fi
          echo "Inputs OK: mode=$MODE arxiv_id=$ARXIV_ID slug=$SLUG needs_figures=$NEEDS_FIGS"

      # docs/papers/ 按发表日(frontmatter.date)分桶到 <YYYY>/<MM>/<DD>/ 子目录。
      # - bioRxiv 文件名内嵌 YYYY-MM-DD,直接从 BASH_REMATCH 提 DAY。
      # - arxiv id (YYMM.NNNNN) 的 YYMM 是 arxiv 编号≠发表月,YYYY/MM 仍可用 YYMM 作
      #   fallback,但 DAY 必须由 inputs.date 提供;若没传则 day=01(不理想,会在月初目录堆积)。
      # 例:arxiv 2607.00083v1 + date=2026-06-30 → 2026/06/30/(真实发表月是 6 月不是 7 月)
      # 例:biorxiv-10-1101-2025-11-14-... → 2025/11/14/
      # 与 src/paper_paths.py::paper_month_subdir()/paper_day_subdir() 逻辑等价
      # (改一处记得改另两处:scripts/migrate-papers-by-day.mjs + src/paper_paths.py)。
      - name: Derive YEAR/MONTH/DAY subfolder
        env:
          ARXIV_ID: ${{ inputs.arxiv_id }}
          DATE_INPUT: ${{ inputs.date }}
        run: |
          set -euo pipefail
          id="$ARXIV_ID"
          if [[ "$id" =~ ^biorxiv-10-[0-9]+-([0-9]{4})-([0-9]{2})-([0-9]{2})- ]]; then
            YEAR="${BASH_REMATCH[1]}"
            MONTH="${BASH_REMATCH[2]}"
            DAY="${BASH_REMATCH[3]}"
          elif [[ "$id" =~ ^([0-9]{2})([0-9]{2})\. ]]; then
            YEAR="20${BASH_REMATCH[1]}"
            MONTH="${BASH_REMATCH[2]}"
            if [[ -n "$DATE_INPUT" && "$DATE_INPUT" =~ ^([0-9]{4})-([0-9]{2})-([0-9]{2})$ ]]; then
              # date 输入优先,允许 YYYY/MM 与 arxiv YYMM 不一致(如月底跨月)
              YEAR="${BASH_REMATCH[1]}"
              MONTH="${BASH_REMATCH[2]}"
              DAY="${BASH_REMATCH[3]}"
            elif [[ -n "$DATE_INPUT" ]]; then
              echo "::error::date 输入格式非法(期望 YYYY-MM-DD),收到: $DATE_INPUT"
              exit 1
            else
              DAY="01"
              echo "::warning::arxiv id=$id 没传 date 输入,day=01(月末论文可能分桶错误,建议 web 端补传 date)"
            fi
          else
            echo "::error::无法从 arxiv_id=$id 提取 YYYY/MM(arXiv/biorxiv 模式都不匹配)"
            exit 1
          fi
          if (( 10#$MONTH < 1 || 10#$MONTH > 12 )); then
            echo "::error::月份越界 YEAR=$YEAR MONTH=$MONTH"
            exit 1
          fi
          if (( 10#$DAY < 1 || 10#$DAY > 31 )); then
            echo "::error::日期越界 DAY=$DAY"
            exit 1
          fi
          echo "YEAR=$YEAR" >> "$GITHUB_ENV"
          echo "MONTH=$MONTH" >> "$GITHUB_ENV"
          echo "DAY=$DAY" >> "$GITHUB_ENV"
          echo "Derived subfolder: docs/papers/$YEAR/$MONTH/$DAY/"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Python (for figure extraction)
        if: inputs.needs_figures == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install PyMuPDF for figure extraction
        if: inputs.needs_figures == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyMuPDF Pillow requests

      - name: Extract figures from PDF
        if: inputs.needs_figures == 'true'
        env:
          ARXIV_ID: ${{ inputs.arxiv_id }}
          PDF_URL: ${{ inputs.figures_url }}
        run: |
          set -euo pipefail
          if [[ -z "$PDF_URL" ]]; then
            echo "::error::needs_figures=true 但 figures_url 为空,跳过抽图"
            # 不阻塞 commit: 精读本身仍可保存,只是没图
            exit 0
          fi
          mkdir -p "docs/assets/figures/arxiv/${ARXIV_ID}"
          python - <<PY
          import os, sys
          sys.path.insert(0, 'src')
          from paper_figures import ensure_paper_media
          figs, tables = ensure_paper_media(
            pdf_url=os.environ['PDF_URL'],
            docs_dir='docs',
            source_key='arxiv',
            asset_key=os.environ['ARXIV_ID'],
          )
          print(f'[OK] extracted figures={len(figs)} tables={len(tables)} for {os.environ["ARXIV_ID"]}')
          PY

      - name: Sync figures_json into existing .md frontmatter
        # 只对 append-deepdive 有意义:这种模式 .md 已存在,这里只是把图字段补上。
        # combined 模式 .md 还不存在("Write paper file" 步才写),如果这里先跑
        # 会 FileNotFoundError,然后下面的精读步骤也错乱。先修掉。
        if: inputs.mode == 'append-deepdive'
        env:
          YEAR: ${{ env.YEAR }}
          MONTH: ${{ env.MONTH }}
          DAY: ${{ env.DAY }}
          FILE: docs/papers/${{ env.YEAR }}/${{ env.MONTH }}/${{ env.DAY }}/${{ inputs.arxiv_id }}-${{ inputs.slug }}.md
          ARXIV_ID: ${{ inputs.arxiv_id }}
        run: |
          set -euo pipefail
          # 抽图后,扫描 docs/assets/figures/arxiv/<id>/fig-*.webp 实际文件,
          # 把列表写回 .md 的 figures_json frontmatter 字段。
          # 这样 docs 网站页面的"📊 论文图表"区块能反映最新抽出的图。
          # 用于 append-deepdive 和 combined 两种模式(两者都期望 .md 存在)。
          python - <<'PY'
          import glob, json, os, re
          file = os.environ['FILE']
          arxiv_id = os.environ['ARXIV_ID']
          fig_dir = f'docs/assets/figures/arxiv/{arxiv_id}'
          webps = sorted(glob.glob(f'{fig_dir}/fig-*.webp'))
          if not webps:
              print(f'[INFO] {arxiv_id} 没有图文件,跳过 figures_json 更新')
              import sys; sys.exit(0)
          fig_entries = []
          for i, fp in enumerate(webps, 1):
              rel = fp[len('docs/'):]
              fig_entries.append({
                  "url": rel,
                  "caption": "",
                  "page": 0,
                  "index": i,
                  "width": 0,
                  "height": 0,
              })
          figures_json_str = json.dumps(fig_entries, ensure_ascii=False)

          if not os.path.exists(file):
              print(f'[WARN] {file} 不存在,跳过')
              import sys; sys.exit(0)

          with open(file, 'r', encoding='utf-8') as f:
              existing = f.read()

          # 替换或插入 figures_json 行
          # figures_json 的 value 必须是合法 YAML + 内部 JSON。两种合法写法:
          #   figures_json: <json.dumps(json_array)>   — JSON-double-quoted,PyYAML 当 plain scalar 解析
          #   figures_json: "{<json_array>}"            — YAML 双引号字符串包整体(JSON 自身有双引号要转义)
          # 这里用 json.dumps(..., ensure_ascii=False) 走第一种 —— 与 src/6.generate_docs.py 的
          # `figures_json: {yaml_escape_value(json.dumps(...))}` 形式对齐。
          # 之前 insert 分支直接包 "..." 不转义内部 ",PyYAML 解析到第一个内部 " 就报错,
          # 整个 frontmatter 读不到 → notes 永远没有图。
          if re.search(r'^figures_json:\s', existing, re.MULTILINE):
              new_existing = re.sub(
                  r'^figures_json:\s.*$',
                  f'figures_json: {json.dumps(figures_json_str, ensure_ascii=False)}',
                  existing,
                  count=1,
                  flags=re.MULTILINE,
              )
          else:
              # 插到 --- 闭合前,同样走 json.dumps 包出可解析的 YAML scalar
              new_existing, n = re.subn(
                  r'\n---\n',
                  f'\nfigures_json: {json.dumps(figures_json_str, ensure_ascii=False)}\n---\n',
                  existing, count=1,
              )
              if n == 0:
                  print(f'[WARN] {file} 没有 frontmatter 边界,跳过')
                  import sys; sys.exit(0)

          with open(file, 'w', encoding='utf-8') as f:
              f.write(new_existing)
          print(f'[OK] figures_json 同步: {len(fig_entries)} 张图写入 {file}')
          PY

      - name: Write paper file (glance / combined mode)
        if: inputs.mode == 'glance' || inputs.mode == 'combined'
        env:
          MD_CONTENT: ${{ inputs.md_content }}
          ARXIV_ID: ${{ inputs.arxiv_id }}
          SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          FILE="docs/papers/${YEAR}/${MONTH}/${DAY}/${ARXIV_ID}-${SLUG}.md"
          mkdir -p "docs/papers/${YEAR}/${MONTH}/${DAY}"
          echo "$MD_CONTENT" > "$FILE"
          echo "Wrote $FILE ($(wc -c < "$FILE") bytes)"

      - name: Append deep dive to existing file
        if: inputs.mode == 'append-deepdive'
        env:
          YEAR: ${{ env.YEAR }}
          MONTH: ${{ env.MONTH }}
          DAY: ${{ env.DAY }}
          FILE: docs/papers/${{ env.YEAR }}/${{ env.MONTH }}/${{ env.DAY }}/${{ inputs.arxiv_id }}-${{ inputs.slug }}.md
          DEEP_MD: ${{ inputs.deep_dive_md }}
          USED_MODEL: ${{ inputs.used_model }}
          TRUNCATED_PCT: ${{ inputs.truncated_pct }}
        run: |
          set -euo pipefail
          if [[ ! -f "$FILE" ]]; then
            echo "::error::$FILE 不存在,append-deepdive 需要先有速读 .md"
            exit 1
          fi
          python - <<'PY'
          import glob, os, re, sys

          file = os.environ['FILE']
          deep = os.environ['DEEP_MD'].strip()
          model = os.environ.get('USED_MODEL', '').strip()
          try:
              pct = int(os.environ.get('TRUNCATED_PCT') or '100')
          except ValueError:
              pct = 100

          with open(file, 'r', encoding='utf-8') as f:
              existing = f.read()

          # --- 1. 补 frontmatter figures_json(若 docs/ 仓库已有该论文的图但 .md 没写) ---
          if 'figures_json:' not in existing:
              arxiv_id = os.path.basename(file).split('-')[0]
              fig_dir = f'docs/assets/figures/arxiv/{arxiv_id}'
              figs = sorted(glob.glob(f'{fig_dir}/fig-*.webp'))
              if figs:
                  fig_entries = []
                  for i, fp in enumerate(figs, 1):
                      rel = fp[len('docs/'):]
                      fig_entries.append(
                          '{"url":"' + rel + '","caption":"","page":0,"index":' + str(i) + ',"width":0,"height":0}'
                      )
                  figures_json_str = '[' + ','.join(fig_entries) + ']'
                  # 插到第一个 \n---\n 之前。必须走 json.dumps,不能用裸 "..." 包,
                  # 否则 JSON 内部 " 会让 PyYAML 解析 frontmatter 报错(详情见上一处修复)。
                  new_existing, n = re.subn(
                      r'\n---\n',
                      '\nfigures_json: ' + json.dumps(figures_json_str, ensure_ascii=False) + '\n---\n',
                      existing, count=1,
                  )
                  if n > 0:
                      existing = new_existing
                      print(f'[OK] injected figures_json with {len(figs)} entries')

          # --- 2. 追加/替换精读章节 ---
          truncate_note = f'前 {pct}%' if pct < 100 else '全文'
          model_line = f' · 模型: {model}' if model else ''
          deep_block = (
              '\n\n---\n\n## 深度精读\n\n'
              f'> 基于 PDF 全文生成{model_line} · {truncate_note}\n\n'
              f'{deep}\n'
          )

          replaced = False
          for marker in ['## 深度精读', '## 论文详细总结（自动生成）']:
              idx = existing.find(marker)
              if idx == -1:
                  continue
              # 找到上一个 \n\n---\n\n 分隔;没有就直接截到 marker
              cut = existing.rfind('\n\n---\n\n', 0, idx)
              if cut == -1:
                  cut = idx
              existing = existing[:cut].rstrip() + deep_block
              replaced = True
              print(f'[OK] replaced existing block at marker "{marker}"')
              break
          if not replaced:
              existing = existing.rstrip() + deep_block
              print('[OK] appended new 深度精读 block')

          with open(file, 'w', encoding='utf-8') as f:
              f.write(existing)
          print(f'[OK] wrote {file} ({len(existing)} bytes)')
          PY

      - name: Detect duplicates
        id: dup
        env:
          YEAR: ${{ env.YEAR }}
          MONTH: ${{ env.MONTH }}
          DAY: ${{ env.DAY }}
        run: |
          FILE="docs/papers/${YEAR}/${MONTH}/${DAY}/${{ inputs.arxiv_id }}-${{ inputs.slug }}.md"
          # GitHub Actions 步骤输出必须 echo 到 $GITHUB_OUTPUT,而不是 stdout,
          # 否则 steps.dup.outputs.exists 永远取不到值,"Skip if already committed"
          # 和 "Commit and push" 的 if 判断都退化成空串,等效于无脑 push。
          if git log --all --oneline -- "$FILE" | head -n 1 > /dev/null 2>&1; then
            COUNT=$(git log --all --oneline -- "$FILE" | wc -l | tr -d ' ')
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if already committed
        if: steps.dup.outputs.exists == 'true'
        run: |
          echo "::notice::${{ inputs.arxiv_id }} 已在 docs 里,跳过 commit(覆盖会被 git diff 拦下)"

      - name: Commit and push
        if: steps.dup.outputs.exists != 'true'
        env:
          YEAR: ${{ env.YEAR }}
          MONTH: ${{ env.MONTH }}
          ARXIV_ID: ${{ inputs.arxiv_id }}
          SLUG: ${{ inputs.slug }}
          MSG: ${{ inputs.message }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          FILE="docs/papers/${YEAR}/${MONTH}/${DAY}/${ARXIV_ID}-${SLUG}.md"
          ARXIV_ID_RAW=$(echo "$ARXIV_ID" | sed 's|/|_|g')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 1. 主 .md
          git add "$FILE"
          # 2. 抽出来的图片(若本次走了 needs_figures)
          if git ls-files --others --exclude-standard "docs/assets/figures/arxiv/${ARXIV_ID_RAW}/" 2>/dev/null \
              | grep -E '\.(webp|png|jpg|jpeg)$' > /tmp/new_figs.list; then
            if [ -s /tmp/new_figs.list ]; then
              echo "Adding $(wc -l < /tmp/new_figs.list) figure files"
              cat /tmp/new_figs.list | xargs git add
            fi
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          if [[ "$MODE" == "append-deepdive" ]]; then
            DEFAULT_MSG="chore: deep dive ${ARXIV_ID} via web analyzer"
          elif [[ "$MODE" == "combined" ]]; then
            DEFAULT_MSG="chore: speed-read + deep dive ${ARXIV_ID} via web analyzer"
          else
            DEFAULT_MSG="chore: add ${ARXIV_ID} from web analyzer"
          fi
          git commit -m "${MSG:-$DEFAULT_MSG}"
          git push

      # PR-7: Citation Guard — 写盘后跑引用核查,失败仅 warn,不阻塞 commit。
      # 默认 disabled（env.CITATION_GUARD_ENABLED 在 workflow 顶层硬编码为 'false'）。
      # 启用方式：临时把工作流 env.CITATION_GUARD_ENABLED 改成 'true'，或加 inputs.citation_guard。
      - name: Run citation guard
        if: ${{ env.CITATION_GUARD_ENABLED == 'true' }}
        continue-on-error: true
        run: |
          echo "[citation-guard] running on docs/papers/**/*.md..."
          for md in $(git diff --name-only HEAD~1 HEAD -- 'docs/papers/**/*.md' 2>/dev/null); do
            if [ -f "$md" ]; then
              python -m citation_guard "$md" || echo "[WARN] citation guard fail: $md"
            fi
          done

      - name: Trigger Cloudflare Pages rebuild
        if: always()
        continue-on-error: true
        env:
          CF_DEPLOY_HOOK_URL: ${{ secrets.CF_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$CF_DEPLOY_HOOK_URL" ]; then
            echo "Pinging Cloudflare Pages deploy hook..."
            curl -X POST "$CF_DEPLOY_HOOK_URL" -f
          else
            echo "CF_DEPLOY_HOOK_URL not set, skipping"
          fi