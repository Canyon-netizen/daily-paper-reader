repos:
  # 1) pytest — offline-safe subset only.
  # These deselects mirror the GitHub Actions CI workflow; they exclude:
  #   - tests that need live Supabase / LLM endpoints
  #   - Windows-only failures (node not on PATH, path separator asserts)
  #   - network-dependent tests that pollute across runs
  - repo: local
    hooks:
      - id: pytest-offline-subset
        name: pytest (offline subset)
        entry: bash -c 'python -m pytest tests/ -q \
          --deselect tests/test_statement_timeout.py \
          --deselect tests/test_model_loader_remote.py \
          --deselect tests/test_reranker_api.py \
          --deselect tests/test_query_embedding_cache.py \
          --deselect tests/test_sync_streaming_pipeline.py \
          --deselect tests/test_supabase_init_and_sync.py \
          --deselect tests/test_conference_workflow_and_ui.py \
          --deselect tests/test_main_pipeline.py \
          --deselect tests/test_init_supabase_parametrized.py \
          --deselect tests/test_fetch_openreview_conference.py \
          --deselect tests/test_fetch_paper_aaai_ojs.py \
          --deselect tests/test_fetch_paper_chemrxiv.py \
          --deselect tests/test_paper_retrieval_core.py \
          --deselect tests/test_sync_backend_key.py \
          --deselect tests/test_maintain_common.py \
          --deselect tests/test_local_debug_env.py \
          --deselect tests/test_p01_fetch_failure.py'
        language: system
        pass_filenames: false
        # 不论改了哪个文件都跑一遍 (因为是测试 + 整套 import 链)
        always_run: true
        stages: [pre-commit]

      # 2) astro check — TypeScript + Astro 组件语法校验
      # 防止 contributor 提交 TS 语法错误导致生产 build 红。
      - id: astro check
        name: astro check (TS + component syntax)
        entry: bash -c 'npx --no-install astro check || echo "[pre-commit] astro check failed or not installed; CI will catch it"'
        language: system
        pass_filenames: false
        files: ^(astro-src/|package\.json$|astro\.config\.mjs$|tsconfig\.json$)
        stages: [pre-commit]

      # 3) 防止 .scratch/ 误提交
      # .scratch/ 已在 .gitignore，但 contributor 可能 `git add -f` 误操作;
      # 这里 fail-fast 让提交前就报错。
      - id: no-scratch-files
        name: forbid committing files under .scratch/
        entry: bash -c 'if git diff --cached --name-only | grep -q "^\.scratch/"; then echo ".scratch/ is gitignored; do not commit files there."; exit 1; fi'
        language: system
        pass_filenames: false
        stages: [pre-commit]
